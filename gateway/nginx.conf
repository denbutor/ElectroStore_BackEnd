events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream auth_upstream {
        server auth_service:8000;
    }

    upstream catalog_upstream {
        server catalog_service:8000;
    }

    upstream order_upstream {
        server order_service:8000;
    }

    upstream ai_upstream {
        server ai_service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # --- Auth Service ---
        location = /api/v1/auth/docs {
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/auth/openapi.json {
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/auth {
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Catalog Service ---
        location = /api/v1/catalog/docs {
            proxy_pass http://catalog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/catalog/openapi.json {
            proxy_pass http://catalog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/catalog/ {
            rewrite ^/api/v1/catalog/(.*)$ /api/v1/$1 break;
            proxy_pass http://catalog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/categories {
            rewrite ^/api/v1/categories(.*)$ /api/v1/products/categories$1 break;
            proxy_pass http://catalog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/products {
            proxy_pass http://catalog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Order Service (Cart & Orders) ---
        location ^~ /api/v1/orders {
            proxy_pass http://order_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/cart {
            proxy_pass http://order_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- AI Service (з SSE стрімінгом) ---
        location = /api/v1/ai/docs {
            rewrite ^/api/v1/ai/docs$ /docs break;
            proxy_pass http://ai_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/v1/ai/openapi.json {
            rewrite ^/api/v1/ai/openapi.json$ /openapi.json break;
            proxy_pass http://ai_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/v1/ai/api/v1/ {
            rewrite ^/api/v1/ai(/api/v1/.*)$ $1 break;
            proxy_pass http://ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location ^~ /api/v1/ai/ {
            rewrite ^/api/v1/ai/(.*)$ /api/v1/$1 break;
            proxy_pass http://ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # --- Frontend ---
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

