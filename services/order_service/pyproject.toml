[project]
name = "order-service"
version = "0.1.0"
description = "Orders & Cart Microservice for ElectroStore"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "orjson>=3.9.15",
    "uvloop>=0.19.0; sys_platform != 'win32'",
]